<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Millennium POS — pas de connexion</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
      background: #07162B; color: #F4F7FB; font-family: system-ui, sans-serif; text-align: center; }
    .logo { width: 72px; height: 72px; margin: 0 auto 20px; border-radius: 20px; display: flex; align-items: center; justify-content: center;
      font-weight: 900; font-size: 26px; background: linear-gradient(135deg, #FF8A00, #F0441E); }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { color: #A3B3C9; max-width: 340px; margin: 0 auto 24px; line-height: 1.5; }
    button { min-height: 52px; padding: 0 28px; border: 0; border-radius: 14px; color: #fff; font-size: 16px; font-weight: 700;
      background: linear-gradient(135deg, #FF8A00, #F0441E); }
    small { display: block; margin-top: 18px; color: #6B7F9C; }
  </style>
</head>
<body>
  <div>
    <div class="logo">MP</div>
    <h1>Pas de connexion internet</h1>
    <p>La caisse a besoin d'internet pour démarrer. Une fois ouverte, vous pouvez continuer à vendre pendant les coupures.</p>
    <button onclick="location.replace('https://milleniumgrouphaiti.com/pos/caisse')">Réessayer</button>
    <small>Nouvel essai automatique au retour du réseau…</small>
  </div>
  <script>
    var URL_CAISSE = 'https://milleniumgrouphaiti.com/pos/caisse';
    window.addEventListener('online', function () { location.replace(URL_CAISSE); });
    setInterval(function () { if (navigator.onLine) location.replace(URL_CAISSE); }, 15000);
  </script>
</body>
</html>
