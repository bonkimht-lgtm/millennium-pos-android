name: Créer la clé de signature (une seule fois)

on:
  workflow_dispatch: {}

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Générer la clé
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ] || [ ${#KEYSTORE_PASSWORD} -lt 12 ]; then
            echo "::error::Créez d'abord le secret KEYSTORE_PASSWORD (12 caractères minimum)."
            exit 1
          fi
          mkdir -p out
          keytool -genkeypair -v -keystore out/millennium-pos.jks -alias millennium \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" \
            -dname "CN=Millennium Group, OU=Millennium Lab, O=Millennium Group, L=Saint-Marc, C=HT"
          base64 -w 0 out/millennium-pos.jks > out/KEYSTORE_BASE64.txt
          echo "Clé créée. Téléchargez l'artefact, puis supprimez-le."

      - name: Télécharger la clé (artefact, supprimé après 1 jour)
        uses: actions/upload-artifact@v4
        with:
          name: cle-millennium-pos
          path: out/
          retention-days: 1
