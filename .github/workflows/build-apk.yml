name: Construire l'APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

defaults:
  run:
    working-directory: apk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Outils Android
        uses: android-actions/setup-android@v3

      - name: Installer les dépendances
        run: npm install

      - name: Créer le projet Android
        run: npx cap add android

      - name: Générer les icônes et l'écran de démarrage
        run: npx @capacitor/assets generate --android --iconBackgroundColor "#07162B" --splashBackgroundColor "#07162B" --splashBackgroundColorDark "#07162B"

      - name: Préparer la clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/millennium.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/millennium.jks" >> "$GITHUB_ENV"
            echo "Clé trouvée : APK signé."
          else
            echo "Aucune clé : APK de test uniquement."
          fi

      - name: Configurer le projet Android
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: node scripts/prepare-android.mjs

      - name: Synchroniser
        run: npx cap sync android

      - name: Compiler l'APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: millennium
        run: |
          cd android
          chmod +x gradlew
          mkdir -p ../dist
          if [ -n "$KEYSTORE_PATH" ]; then
            ./gradlew assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk ../dist/millennium-pos.apk
          else
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../dist/millennium-pos-test.apk
          fi
          ls -la ../dist

      - name: Garder l'APK (téléchargeable dans l'onglet Actions)
        uses: actions/upload-artifact@v4
        with:
          name: millennium-pos-apk
          path: apk/dist/*.apk
          retention-days: 30

      - name: Publier la version (lien de téléchargement public)
        if: env.KEYSTORE_PATH != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Millennium POS 1.0.${{ github.run_number }}
          body: Application Android Millennium POS. Téléchargez millennium-pos.apk ci-dessous.
          files: apk/dist/millennium-pos.apk
          make_latest: true
